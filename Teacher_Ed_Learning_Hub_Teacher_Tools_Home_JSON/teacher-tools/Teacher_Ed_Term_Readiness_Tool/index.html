<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Teacher Ed Learning Hub — Term Readiness & Diagnostic Tool"
    />
    <meta name="theme-color" content="#0b2a5b" />
    <title>Term Readiness & Diagnostic Tool | Teacher Ed Learning Hub</title>
    <link
      rel="icon"
      type="image/png"
      href="assets/teacher-ed-learning-hub-logo.png"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <img
            src="assets/teacher-ed-learning-hub-logo.png"
            alt="Teacher Ed Learning Hub logo"
          />
          <div>
            <strong>Teacher Ed</strong>
            <span>Learning Hub</span>
          </div>
        </div>
        <button
          class="mobile-close"
          id="mobileClose"
          aria-label="Close navigation"
        >
          ×
        </button>
        <nav class="nav" aria-label="Main navigation">
          <button class="nav-item active" data-view="dashboard">
            ▦ <span>Dashboard</span>
          </button>
          <button class="nav-item" data-view="term">
            ⚙ <span>Term Setup</span>
          </button>
          <button class="nav-item" data-view="competencies">
            ◆ <span>Competencies</span>
          </button>
          <button class="nav-item" data-view="assessment">
            ✎ <span>Diagnostic Assessment</span>
          </button>
          <button class="nav-item" data-view="students">
            ♙ <span>Student Profiles</span>
          </button>
          <button class="nav-item" data-view="groups">
            ◉ <span>Readiness Groups</span>
          </button>
          <button class="nav-item" data-view="gaps">
            ▤ <span>Learning Gap Analysis</span>
          </button>
          <button class="nav-item" data-view="bridge">
            ↔ <span>Bridge Lesson Planner</span>
          </button>
          <button class="nav-item" data-view="intervention">
            ✚ <span>Intervention Planner</span>
          </button>
          <button class="nav-item" data-view="reassessment">
            ✓ <span>Reassessment</span>
          </button>
          <button class="nav-item" data-view="progress">
            ↗ <span>Progress Monitoring</span>
          </button>
          <button class="nav-item" data-view="reports">
            ▣ <span>Reports & Export</span>
          </button>
          <button class="nav-item" data-view="settings">
            ⚙ <span>Settings</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <small
            >Diagnose → Understand → Intervene → Reassess → Monitor →
            Master</small
          >
        </div>
      </aside>

      <div class="overlay" id="overlay"></div>

      <main class="main">
        <header class="topbar">
          <button class="menu-btn" id="menuBtn" aria-label="Open navigation">
            ☰
          </button>
          <div>
            <h1 id="pageTitle">Term Readiness & Diagnostic Tool</h1>
            <p id="pageSubtitle">
              Diagnose • Plan • Intervene • Reassess • Monitor
            </p>
          </div>
          <div class="topbar-meta" id="termBadge">No term set</div>
        </header>

        <div id="viewContainer" class="view-container"></div>

        <footer class="footer">
          <img
            src="assets/teacher-ed-learning-hub-logo.png"
            alt=""
            aria-hidden="true"
          />
          <div>
            <strong>Teacher Ed Learning Hub</strong>
            <span>Learn • Teach • Lead • Inspire</span>
          </div>
          <small>© 2026 Teacher Ed Learning Hub</small>
        </footer>
      </main>
    </div>

    <div class="modal-backdrop hidden" id="modalBackdrop">
      <section
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <div class="modal-head">
          <h2 id="modalTitle">Modal</h2>
          <button class="icon-btn" id="modalClose" aria-label="Close">×</button>
        </div>
        <div id="modalBody"></div>
      </section>
    </div>

    <div class="toast-container" id="toastContainer" aria-live="polite"></div>
    <script src="js/app.js"></script>
  </body>
</html>
